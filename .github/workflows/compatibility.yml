name: Embedding compatibility
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.13t', '3.14t']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Configure
        shell: bash
        run: cmake -S . -B build-ci -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" -DCMAKE_BUILD_TYPE=Release -DDITTOBIND_COMPARE_PYBIND11=ON -DDITTOBIND_TEST_NUMPY=ON
      - run: cmake --build build-ci --config Release --parallel 2
      - run: ctest --test-dir build-ci -C Release --output-on-failure --output-junit results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.python }}
          path: |
            build-ci/results.xml
            build-ci/Testing/Temporary/LastTest.log
